<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenLaneLink architecture sketch</title>
  <desc id="desc">A compact diagram showing lane equipment, ESP32 edge nodes, lane compute, an event bus, and dashboards.</desc>
  <defs>
    <clipPath id="ol-edge"><rect x="252" y="118" width="150" height="70" rx="14"/></clipPath>
    <clipPath id="ol-compute"><rect x="252" y="226" width="150" height="70" rx="14"/></clipPath>
    <clipPath id="ol-event"><rect x="474" y="164" width="116" height="72" rx="14"/></clipPath>
  </defs>
  <rect width="760" height="360" rx="24" fill="#0b1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8593a0" letter-spacing="1.3"><text x="38" y="42">OPENLANELINK / FAILURE-BOUNDED CONTROL</text></g>
  <g fill="#111b24" stroke="#34424f" stroke-width="1.5">
    <rect x="46" y="88" width="138" height="54" rx="12"/><rect x="46" y="170" width="138" height="54" rx="12"/><rect x="46" y="252" width="138" height="54" rx="12"/>
    <rect x="252" y="118" width="150" height="70" rx="14" stroke="#f2b84b"/><rect x="252" y="226" width="150" height="70" rx="14" stroke="#f2b84b"/>
    <rect x="474" y="164" width="116" height="72" rx="14" stroke="#5ad7e8"/><rect x="640" y="102" width="82" height="54" rx="12"/><rect x="640" y="244" width="82" height="54" rx="12"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#edf2f5" text-anchor="middle">
    <text x="115" y="121" font-size="16.5">Lane I/O</text><text x="115" y="203" font-size="16.5">Sensors</text><text x="115" y="285" font-size="16.5">Pinsetter</text>
    <text x="327" y="145" font-size="16" clip-path="url(#ol-edge)">ESP32 edge</text>
    <text x="327" y="168" fill="#a6b1bb" font-size="12.5" clip-path="url(#ol-edge)"><tspan x="327" dy="0">wireless + wired</tspan><tspan x="327" dy="16">fallback</tspan></text>
    <text x="327" y="253" font-size="16" clip-path="url(#ol-compute)">Lane compute</text>
    <text x="327" y="270" fill="#a6b1bb" font-size="12" clip-path="url(#ol-compute)"><tspan x="327" dy="0">state + local</tspan><tspan x="327" dy="14">control</tspan></text>
    <text x="532" y="194" font-size="16" clip-path="url(#ol-event)"><tspan x="532" dy="0">Event</tspan><tspan x="532" dy="20">bus</tspan></text>
    <text x="681" y="134" font-size="15">Score</text><text x="681" y="276" font-size="15">Ops</text>
  </g>
  <g stroke-width="2" fill="none"><path d="M184 115L252 147M184 197L252 153M184 279L252 261" stroke="#f2b84b"/><path d="M402 153L474 191M402 261L474 210M590 188L640 129M590 213L640 271" stroke="#5ad7e8"/></g>
</svg>
